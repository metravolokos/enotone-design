<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Android v2: Альбомы</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@600&amp;display=swap">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif}
button{background:none;border:0;font:inherit;color:inherit;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ph{width:377px;height:816px;border-radius:56px;overflow:hidden;background:var(--bg);color:var(--tx);box-shadow:0 24px 60px var(--sh);position:relative}
.lbl{font-size:15px;font-weight:600;color:#141210;margin-bottom:12px}
.cv{flex:none;border-radius:10px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(128,118,110,.18)}
[data-theme=dark]{--bg:#1B1A19;--sf:#252321;--sf2:#2F2C2A;--ln:#3A3633;--tx:#F4ECE4;--tx2:#B9AEA4;--ac:#EBAE9F;--onac:#1B1A19;--act:#EBAE9F;--sh:rgba(0,0,0,.5);--scrim:rgba(0,0,0,.55)}
[data-theme=light]{--bg:#EDE9E5;--sf:#F8F5F1;--sf2:#E2DCD6;--ln:#CFC6BE;--tx:#211E1C;--tx2:#5C544E;--ac:#EBAE9F;--onac:#211E1C;--act:#A24F3E;--sh:rgba(60,40,30,.22);--scrim:rgba(33,30,28,.38)}
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:56px 18px 0 28px}
.top h1{margin:0;font-family:'Unbounded',sans-serif;font-weight:600;font-size:30px;line-height:1.1}
.ib{width:48px;height:48px;border-radius:24px;color:var(--tx)}
.cnt{padding:6px 28px 0;font-size:14px;color:var(--tx2)}
.tt{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss{font-size:13.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.pill{flex:1;height:48px;border-radius:24px;gap:8px;font-size:16px;font-weight:600}
.pill.p{background:var(--ac);color:var(--onac)}
.pill.s{background:var(--sf2);color:var(--tx)}
.fade{position:absolute;left:0;right:0;bottom:0;height:250px;background:linear-gradient(to bottom,transparent,var(--bg) 42%)}
.dock{position:absolute;left:12px;right:12px;bottom:22px;display:flex;flex-direction:column;gap:8px}
.mini{height:64px;border-radius:22px;background:var(--sf);box-shadow:0 8px 24px var(--sh);display:flex;align-items:center;gap:12px;padding:0 6px 0 10px;position:relative;overflow:hidden}
.mini .tt{font-size:15px}.mini .ss{margin-top:1px}
.mini .ctl{width:48px;height:48px;color:var(--tx)}
.mp{position:absolute;left:16px;right:16px;bottom:0;height:2px;background:var(--ln)}
.mp .b{position:absolute;left:0;top:0;bottom:0;background:var(--tx2);opacity:.38}
.mp .f{position:absolute;left:0;top:0;bottom:0;background:var(--tx)}
.nav{height:70px;border-radius:35px;background:var(--sf2);display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.ni{flex:1;height:62px;flex-direction:column;gap:3px;font-size:11.5px;font-weight:500;color:var(--tx2)}
.ni.on{color:var(--act);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:12px;row-gap:20px;padding:18px 28px 0}
.al{display:flex;flex-direction:column;align-items:stretch;text-align:left;min-width:0}
.al .cv{width:100%;aspect-ratio:1;border-radius:16px}
.al .tt{font-size:15px;margin-top:8px}.al .ss{margin-top:2px}
</style>
</helmet>
<div style="display:flex;gap:48px;padding:48px;box-sizing:border-box;width:898px;height:960px;background:#8E8A86">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div>
  <div class="lbl">{{t.label}}</div>
  <div class="ph" data-theme="{{t.id}}">
    <div class="top"><h1>Альбомы</h1><button class="ib" aria-label="Поиск"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.3" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M15.3 15.3 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button></div>
    <div class="cnt">[N] альбомов</div>
    <div class="grid">
      <button class="al" aria-label="[Название альбома], [Исполнитель]"><div class="cv" style="background:#8FB0C2"></div><div class="tt">[Название альбома]</div><div class="ss">[Исполнитель]</div></button>
      <button class="al" aria-label="[Очень длинное название альбома с подзаголовком], [Исполнитель feat. Гость]"><div class="cv" style="background:#4F7487"></div><div class="tt">[Очень длинное название альбома с подзаголовком]</div><div class="ss">[Исполнитель feat. Гость]</div></button>
      <button class="al" aria-label="[Альбом], [Группа]"><div class="cv" style="background:#3A3633"></div><div class="tt">[Альбом]</div><div class="ss">[Группа]</div></button>
      <button class="al" aria-label="[Сборник], Разные исполнители"><div class="cv" style="background:#F4ECE4"></div><div class="tt">[Сборник]</div><div class="ss">Разные исполнители</div></button>
      <button class="al" aria-label="[Название альбома], [Исполнитель]"><div class="cv" style="background:#EBAE9F"></div><div class="tt">[Название альбома]</div><div class="ss">[Исполнитель]</div></button>
      <button class="al" aria-label="[Альбом], [Неизвестный исполнитель]"><div class="cv" style="background:#B9AEA4"></div><div class="tt">[Альбом]</div><div class="ss">[Неизвестный исполнитель]</div></button>
    </div>
    <div class="fade" aria-hidden="true"></div>
    <div class="dock">
      <div class="mini">
        <button aria-label="Открыть «Сейчас играет»" style="flex:1;min-width:0;justify-content:flex-start;gap:12px;text-align:left">
          <div class="cv" style="width:44px;height:44px;background:#EBAE9F"></div>
          <div style="min-width:0"><div class="tt">[Название трека]</div><div class="ss">[Исполнитель]</div></div>
        </button>
        <button class="ctl" aria-label="Пауза"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M7.9 4.8h0.8a1.9 1.9 0 0 1 1.9 1.9v10.6a1.9 1.9 0 0 1 -1.9 1.9h-0.8a1.9 1.9 0 0 1 -1.9 -1.9v-10.6a1.9 1.9 0 0 1 1.9 -1.9z" fill="currentColor"></path><path d="M15.3 4.8h0.8a1.9 1.9 0 0 1 1.9 1.9v10.6a1.9 1.9 0 0 1 -1.9 1.9h-0.8a1.9 1.9 0 0 1 -1.9 -1.9v-10.6a1.9 1.9 0 0 1 1.9 -1.9z" fill="currentColor"></path></svg></button>
        <button class="ctl" aria-label="Следующий"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M3.8 7.2 11 12l-7.2 4.8zM12.4 7.2l7.2 4.8-7.2 4.8z" fill="currentColor" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        <div class="mp" aria-hidden="true"><div class="b" style="width:64%"></div><div class="f" style="width:38%"></div></div>
      </div>
      <nav class="nav" aria-label="Разделы"><button class="ni" aria-label="Домой"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M4.6 10.4 12 4.3l7.4 6.1V18a2.2 2.2 0 0 1-2.2 2.2h-2.7v-4.6a1.2 1.2 0 0 0-1.2-1.2h-2.6a1.2 1.2 0 0 0-1.2 1.2v4.6H6.8A2.2 2.2 0 0 1 4.6 18z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Домой</span></button><button class="ni" aria-label="Песни"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M9.2 17.6V6.8l10-2.3v10.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M4.4 17.6a2.4 2.4 0 1 0 4.8 0a2.4 2.4 0 1 0 -4.8 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M14.4 15.3a2.4 2.4 0 1 0 4.8 0a2.4 2.4 0 1 0 -4.8 0z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Песни</span></button><button class="ni on" aria-label="Альбомы" aria-current="page"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M8.3 2.5h7.4a5.8 5.8 0 0 1 5.8 5.8v7.4a5.8 5.8 0 0 1 -5.8 5.8h-7.4a5.8 5.8 0 0 1 -5.8 -5.8v-7.4a5.8 5.8 0 0 1 5.8 -5.8zM7.9 12a4.1 4.1 0 1 0 8.2 0a4.1 4.1 0 1 0 -8.2 0z" fill="currentColor" fill-rule="evenodd"></path><path d="M10.7 12a1.3 1.3 0 1 0 2.6 0a1.3 1.3 0 1 0 -2.6 0z" fill="currentColor"></path></svg><span>Альбомы</span></button><button class="ni" aria-label="Артисты"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 3h0a3 3 0 0 1 3 3v5.5a3 3 0 0 1 -3 3h0a3 3 0 0 1 -3 -3v-5.5a3 3 0 0 1 3 -3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M5.8 11.4a6.2 6.2 0 0 0 12.4 0M12 17.6v3M9.2 20.6h5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Артисты</span></button><button class="ni" aria-label="Авторы"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M15.70 8.60 L15.63 7.88 L15.42 7.18 L15.08 6.54 L14.62 5.98 L14.06 5.52 L13.42 5.18 L12.72 4.97 L12.00 4.90 L11.28 4.97 L10.58 5.18 L9.94 5.52 L9.38 5.98 L8.92 6.54 L8.58 7.18 L8.37 7.88 L8.30 8.60 L8.37 9.32 L8.58 10.02 L8.92 10.66 L9.38 11.22 L9.94 11.68 L10.58 12.02 L11.28 12.23 L12.00 12.30 L12.72 12.23 L13.42 12.02 L14.06 11.68 L14.62 11.22 L15.08 10.66 L15.42 10.02 L15.63 9.32 L15.70 8.60 M4.80 21.00 L4.84 20.26 L4.96 19.52 L5.29 18.45 L5.80 17.45 L6.22 16.83 L6.71 16.25 L7.26 15.73 L7.86 15.27 L8.51 14.88 L9.20 14.55 L9.92 14.30 L10.67 14.12 L11.81 14.00 L12.57 14.02 L13.33 14.12 L14.44 14.42 L15.15 14.70 L15.82 15.07 L16.45 15.49 L17.02 15.98 L17.78 16.83 L18.20 17.45 L18.56 18.11 L18.84 18.80 L19.04 19.52 L19.16 20.26 L19.20 21.00 M5.94 5.51 L5.33 5.40 L4.82 5.43 L4.32 5.55 L3.76 5.84 L3.27 6.25 L2.97 6.66 L2.75 7.12 L2.61 7.75 L2.61 8.25 L2.75 8.88 L3.04 9.44 L3.36 9.84 L3.86 10.23 L4.32 10.45 L4.95 10.59 L5.50 10.58 M0.60 19.60 L0.70 18.37 L0.92 17.49 L1.37 16.39 L1.82 15.67 L2.36 15.04 L2.76 14.68 L3.19 14.38 L3.87 14.05 L4.75 13.83 M21.40 8.00 L21.32 7.37 L21.09 6.77 L20.73 6.25 L20.35 5.91 L19.91 5.65 L19.31 5.45 L18.67 5.40 L18.06 5.51 M18.50 10.58 L19.05 10.59 L19.55 10.49 L20.14 10.23 L20.55 9.93 L20.96 9.44 L21.20 8.99 L21.35 8.51 L21.40 8.00 M19.25 13.83 L20.13 14.05 L20.81 14.38 L21.44 14.85 L22.18 15.67 L22.63 16.39 L23.08 17.49 L23.30 18.37 L23.40 19.60" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Авторы</span></button></nav>
    </div>
  </div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":898,"height":960}}'>
class Component extends DCLogic {
  renderVals() {

    return { themes: [{ id: 'dark', label: 'Графит' }, { id: 'light', label: 'Фарфор' }] };
  }
}
</script>
</body>
</html>
