<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Android v2: Авторы альбомов</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@600&amp;display=swap">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif}
button{background:none;border:0;font:inherit;color:inherit;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ph{width:377px;height:816px;border-radius:56px;overflow:hidden;background:var(--bg);color:var(--tx);box-shadow:0 24px 60px var(--sh);position:relative}
.lbl{font-size:15px;font-weight:600;color:#141210;margin-bottom:12px}
.cv{flex:none;border-radius:10px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(128,118,110,.18)}
[data-theme=dark]{--bg:#1B1A19;--sf:#252321;--sf2:#2F2C2A;--ln:#3A3633;--tx:#F4ECE4;--tx2:#B9AEA4;--ac:#EBAE9F;--onac:#1B1A19;--act:#EBAE9F;--sh:rgba(0,0,0,.5);--scrim:rgba(0,0,0,.55)}
[data-theme=light]{--bg:#EDE9E5;--sf:#F8F5F1;--sf2:#E2DCD6;--ln:#CFC6BE;--tx:#211E1C;--tx2:#5C544E;--ac:#EBAE9F;--onac:#211E1C;--act:#A24F3E;--sh:rgba(60,40,30,.22);--scrim:rgba(33,30,28,.38)}
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:56px 18px 0 28px}
.top h1{margin:0;font-family:'Unbounded',sans-serif;font-weight:600;font-size:30px;line-height:1.1}
.ib{width:48px;height:48px;border-radius:24px;color:var(--tx)}
.cnt{padding:6px 28px 0;font-size:14px;color:var(--tx2)}
.tt{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss{font-size:13.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.pill{flex:1;min-width:0;height:48px;border-radius:24px;gap:7px;font-size:15.5px;font-weight:600;white-space:nowrap}
.pill.p{background:var(--ac);color:var(--onac)}
.pill.s{background:var(--sf2);color:var(--tx)}
.fade{position:absolute;left:0;right:0;bottom:0;height:250px;background:linear-gradient(to bottom,transparent,var(--bg) 42%)}
.dock{position:absolute;left:12px;right:12px;bottom:22px;display:flex;flex-direction:column;gap:8px}
.mini{height:64px;border-radius:22px;background:var(--sf);box-shadow:0 8px 24px var(--sh);display:flex;align-items:center;gap:12px;padding:0 6px 0 10px;position:relative;overflow:hidden}
.mini .tt{font-size:15px}.mini .ss{margin-top:1px}
.mini .ctl{width:48px;height:48px;color:var(--tx)}
.mp{position:absolute;left:16px;right:16px;bottom:0;height:2px;background:var(--ln)}
.mp .b{position:absolute;left:0;top:0;bottom:0;background:var(--tx2);opacity:.38}
.mp .f{position:absolute;left:0;top:0;bottom:0;background:var(--tx)}
.nav{height:70px;border-radius:35px;background:var(--sf2);display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.ni{flex:1;height:62px;flex-direction:column;gap:3px;font-size:11.5px;font-weight:500;color:var(--tx2)}
.ni.on{color:var(--act);font-weight:600}
.list{padding:14px 10px 0 28px}
.ar{display:flex;align-items:center;gap:14px;height:68px;width:100%;text-align:left}
.av{width:48px;height:48px;border-radius:24px;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Unbounded',sans-serif;font-weight:600;font-size:18px}
.ar .meta{flex:1;min-width:0;height:68px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--ln)}
</style>
</helmet>
<div style="display:flex;gap:48px;padding:48px;box-sizing:border-box;width:898px;height:960px;background:#8E8A86">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div>
  <div class="lbl">{{t.label}}</div>

      <button class="ar" aria-label="[Бэнд]"><div class="av" aria-hidden="true" style="width:48px;height:48px;border-radius:24px;background:#4F7487;color:#F4ECE4;font-size:18px">Б</div><div class="meta"><div class="tt">[Бэнд]</div><div class="ss">1 альбом</div></div></button>

      <button class="ar" aria-label="[Даниил]"><div class="av" aria-hidden="true" style="width:48px;height:48px;border-radius:24px;background:#B9AEA4;color:#1B1A19;font-size:18px">Д</div><div class="meta"><div class="tt">[Даниил]</div><div class="ss">1 альбом</div></div></button>
