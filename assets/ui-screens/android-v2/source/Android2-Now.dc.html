<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Android v2: Сейчас играет</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Onest',system-ui,sans-serif}
[data-theme=dark]{--bg:#1B1A19;--sf:#252321;--sf2:#2F2C2A;--ln:#3A3633;--tx:#F4ECE4;--tx2:#B9AEA4;--ac:#EBAE9F;--onac:#1B1A19;--act:#EBAE9F;--sh:rgba(0,0,0,.5)}
[data-theme=light]{--bg:#EDE9E5;--sf:#F8F5F1;--sf2:#E2DCD6;--ln:#CFC6BE;--tx:#211E1C;--tx2:#5C544E;--ac:#EBAE9F;--onac:#211E1C;--act:#A24F3E;--sh:rgba(60,40,30,.22)}
button{background:none;border:0;font:inherit;color:inherit;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ph{width:377px;height:816px;border-radius:56px;overflow:hidden;background:var(--bg);color:var(--tx);box-shadow:0 24px 60px var(--sh);display:flex;flex-direction:column;box-sizing:border-box;padding:0 28px}
.lbl{font-size:15px;font-weight:600;color:#141210;margin-bottom:12px}
.grab{height:44px;margin-top:34px;align-self:center;width:88px}
.grab span{display:block;width:40px;height:5px;border-radius:3px;background:var(--ln)}
.cover{width:321px;height:321px;border-radius:24px;flex:none;margin-top:12px;position:relative;overflow:hidden;background:var(--sf2);box-shadow:0 22px 44px var(--sh)}
.meta{display:flex;align-items:flex-start;gap:12px;margin-top:26px}
.meta h2{margin:0;font-size:23px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p{margin:4px 0 0;font-size:18px;font-weight:500;color:var(--act);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{display:block;margin-top:3px;font-size:14px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{width:44px;height:44px;border-radius:22px;background:var(--sf2);flex:none;color:var(--tx)}
.seek{margin-top:22px;height:24px;position:relative}
.seek .rail{position:absolute;left:0;right:16px;top:0;height:24px}
.seek .tr{position:absolute;left:0;right:0;top:10px;height:4px;border-radius:2px;background:var(--ln)}
.seek .buf{position:absolute;left:0;top:10px;height:4px;border-radius:2px;background:var(--tx2);opacity:.38}
.seek .fill{position:absolute;left:0;top:10px;height:4px;border-radius:2px;background:var(--tx)}
.seek .th{position:absolute;top:6px;width:12px;height:12px;border-radius:6px;background:var(--tx)}
.nx{position:absolute;right:0;top:8px;width:8px;height:8px;border-radius:4px}
.nx.loading{background:var(--tx2);animation:nxblink 1.1s ease-in-out infinite}
.nx.ready{background:var(--act);box-shadow:0 0 0 3px color-mix(in srgb,var(--act) 22%,transparent)}
@keyframes nxblink{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.nx.loading{animation:none;opacity:.6}}
.tm{display:flex;justify-content:space-between;font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums;margin-top:2px}
.ctl{display:flex;align-items:center;justify-content:center;gap:28px;margin-top:24px}
.skip{width:64px;height:64px;border-radius:32px;color:var(--tx)}
.play{width:84px;height:84px;border-radius:42px;background:var(--ac);color:var(--onac);box-shadow:0 12px 28px rgba(235,174,159,.32)}
.sec{display:flex;justify-content:space-between;margin:auto 12px 28px}
.sec button{width:48px;height:48px;border-radius:24px;color:var(--tx2)}
.sec button.on{color:var(--act);background:var(--sf2)}
</style>
</helmet>
<div style="display:flex;gap:48px;padding:48px;box-sizing:border-box;width:898px;height:960px;background:#8E8A86">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div>
  <div class="lbl">{{t.label}}</div>
  <div class="ph" data-theme="{{t.id}}">
    <button class="grab" aria-label="Свернуть плеер"><span></span></button>

    <div class="cover" role="img" aria-label="Обложка альбома (заглушка)">
      <svg viewBox="0 0 384 384" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position:absolute;inset:0">
        <rect width="384" height="384" fill="#8FB0C2" opacity="0.35"></rect>
        <circle cx="250" cy="150" r="150" fill="#EBAE9F" opacity="0.55"></circle>
        <circle cx="120" cy="290" r="110" fill="#F4ECE4" opacity="0.35"></circle>
      </svg>
    </div>

    <div class="meta">
      <div style="flex:1;min-width:0">
        <h2>{{track.title}}</h2>
        <p>{{track.artist}}</p>
        <small>{{track.album}}</small>
      </div>
      <button class="more" aria-label="Ещё: в очередь, к альбому, к исполнителю"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M10.1 5.5a1.9 1.9 0 1 0 3.8 0a1.9 1.9 0 1 0 -3.8 0z" fill="currentColor"></path><path d="M10.1 12a1.9 1.9 0 1 0 3.8 0a1.9 1.9 0 1 0 -3.8 0z" fill="currentColor"></path><path d="M10.1 18.5a1.9 1.9 0 1 0 3.8 0a1.9 1.9 0 1 0 -3.8 0z" fill="currentColor"></path></svg></button>
    </div>

    <div class="seek">
      <div class="rail" role="slider" aria-label="Позиция трека" aria-valuemin="0" aria-valuemax="228" aria-valuenow="86" aria-valuetext="1:26 из 3:48, загружено {{bufferedPct}}%" tabindex="0">
        <div class="tr"></div>
        <div class="buf" style="width:{{bufferedW}}"></div>
        <div class="fill" style="width:38%"></div>
        <div class="th" style="left:calc(38% - 6px)"></div>
      </div>
      <sc-if value="{{nextLoading}}" hint-placeholder-val="{{true}}"><span class="nx loading" role="img" aria-label="Следующий трек загружается"></span></sc-if>
      <sc-if value="{{nextReady}}" hint-placeholder-val="{{false}}"><span class="nx ready" role="img" aria-label="Следующий трек готов"></span></sc-if>
    </div>
    <div class="tm"><span>1:26</span><span>−2:22</span></div>

    <div class="ctl">
      <button class="skip" aria-label="Предыдущий"><svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path d="M20.2 7.2 13 12l7.2 4.8zM11.6 7.2 4.4 12l7.2 4.8z" fill="currentColor" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <button class="play" aria-label="{{playLabel}}">
        <sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path d="M7.9 4.8h0.8a1.9 1.9 0 0 1 1.9 1.9v10.6a1.9 1.9 0 0 1 -1.9 1.9h-0.8a1.9 1.9 0 0 1 -1.9 -1.9v-10.6a1.9 1.9 0 0 1 1.9 -1.9z" fill="currentColor"></path><path d="M15.3 4.8h0.8a1.9 1.9 0 0 1 1.9 1.9v10.6a1.9 1.9 0 0 1 -1.9 1.9h-0.8a1.9 1.9 0 0 1 -1.9 -1.9v-10.6a1.9 1.9 0 0 1 1.9 -1.9z" fill="currentColor"></path></svg></sc-if>
        <sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" width="42" height="42" aria-hidden="true" style="margin-left:4px"><path d="M8.4 5.6 18.6 12 8.4 18.4z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
      </button>
      <button class="skip" aria-label="Следующий"><svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path d="M3.8 7.2 11 12l-7.2 4.8zM12.4 7.2l7.2 4.8-7.2 4.8z" fill="currentColor" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    </div>

    <div class="sec">
      <button class="{{shuffleCls}}" aria-label="Перемешать" aria-pressed="{{shuffle}}"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M3.5 7.5h2.2c5.5 0 6.6 9 12.3 9H20M3.5 16.5h2.2c1.8 0 3-.9 4-2.1M13.7 9.6c1-1.3 2.4-2.1 4.3-2.1H20M17.6 5l2.5 2.5-2.5 2.5M17.6 14l2.5 2.5-2.5 2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Очередь"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M4 6.5h11.5M4 11.5h11.5M4 16.5h6.5M18.6 18.2v-7.6l2.4.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M14.5 18.2a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0 -4.4 0z" fill="currentColor"></path></svg></button>
      <button class="{{repeatCls}}" aria-label="Повтор" aria-pressed="{{repeat}}"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M4 12.6V11a4 4 0 0 1 4-4h11.3M16.7 4.3 19.4 7l-2.7 2.7M20 11.4V13a4 4 0 0 1-4 4H4.7M7.3 14.3 4.6 17l2.7 2.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    </div>
  </div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"playing":{"editor":"boolean","default":true},"shuffle":{"editor":"boolean","default":true},"repeat":{"editor":"boolean","default":false},"longTitle":{"editor":"boolean","default":false},"bufferedPct":{"editor":"range","default":64,"min":0,"max":100,"step":1,"unit":"%","section":"Буферизация"},"nextBuffer":{"editor":"enum","options":["none","loading","ready"],"default":"loading","section":"Буферизация"},"$preview":{"width":898,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const playing = this.props.playing ?? true;
    const shuffle = this.props.shuffle ?? true;
    const repeat = this.props.repeat ?? false;
    const long = this.props.longTitle ?? false;
    const buf = Math.max(38, Math.min(100, this.props.bufferedPct ?? 64));
    const nb = this.props.nextBuffer ?? 'loading';
    return {
      themes: [{ id: 'dark', label: 'Графит' }, { id: 'light', label: 'Фарфор' }],
      bufferedPct: String(buf), bufferedW: buf + '%', nextLoading: nb === 'loading', nextReady: nb === 'ready',
      playing, paused: !playing, playLabel: playing ? 'Пауза' : 'Играть',
      shuffle: String(shuffle), shuffleCls: shuffle ? 'on' : '',
      repeat: String(repeat), repeatCls: repeat ? 'on' : '',
      track: long
        ? { title: '[Очень длинное название трека, которое не помещается в строку]', artist: '[Исполнитель с длинным именем и приглашённым гостем]', album: '[Альбом] · 2019' }
        : { title: '[Название трека]', artist: '[Исполнитель]', album: '[Альбом] · 2019' }
    };
  }
}
</script>
</body>
</html>
