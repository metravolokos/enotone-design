name: enoTone Android Icon Smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-icon-smoke/**'
      - 'assets/current/**'
      - 'tools/verify_enotone_assets.py'
      - '.github/workflows/icon-smoke.yml'
  push:
    branches: ['feature/enotone-icon-smoke-*']
    paths:
      - 'android-icon-smoke/**'
      - 'assets/current/**'
      - 'tools/verify_enotone_assets.py'
      - '.github/workflows/icon-smoke.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate full current artwork and smoke resources
        run: python3 tools/verify_enotone_assets.py
      - name: Build debug APK
        working-directory: android-icon-smoke
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: APK checksum
        run: |
          cd android-icon-smoke/app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          cat app-debug.apk.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: enotone-icon-smoke-debug-apk
          path: |
            android-icon-smoke/app/build/outputs/apk/debug/app-debug.apk
            android-icon-smoke/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
