plugins { id 'com.android.application' }

android {
    namespace 'app.enotone.icontest'
    compileSdk 35
    defaultConfig {
        applicationId 'app.enotone.icontest'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0-icon-smoke'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
